<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Red Hook Focacceria, weekend special</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4efe3; --ink:#2a2620; --ink-soft:#554f43;
    --brick:#9e2b25; --brick-d:#7c1d1a; --olive:#3f4632; --amber:#d68a2c; --gold:#b6924f;
    --sd:"Playfair Display",Georgia,serif; --st:"EB Garamond",Georgia,serif; --script:"Pinyon Script",cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#514f45;}
  .sign{
    position:relative; width:1275px; height:1650px; overflow:hidden;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 24% 20%, rgba(120,90,40,.05) 0, transparent 44%),
      radial-gradient(circle at 80% 82%, rgba(120,90,40,.045) 0, transparent 46%);
    color:var(--ink); font-family:var(--st);
    padding:118px 108px 96px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  /* double keyline frame */
  .sign::before{content:"";position:absolute;inset:40px;border:2px solid var(--brick);opacity:.9;}
  .sign::after{content:"";position:absolute;inset:50px;border:1px solid var(--gold);opacity:.8;}

  .wheat{color:var(--brick);display:block;margin:0 auto;}

  /* italic eyebrow */
  .eyebrow-script{font-family:var(--sd);font-style:italic;font-weight:400;font-size:74px;line-height:1.02;color:var(--olive);}
  .flourish{margin:18px auto 0;}

  /* headline */
  .headline{font-family:var(--sd);font-weight:800;text-transform:uppercase;
            font-size:78px;line-height:.98;letter-spacing:.03em;color:var(--ink);margin-top:48px;}
  .headline .hl{color:var(--brick);}
  .rule{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:26px;width:100%;}
  .rule .ln{height:2px;flex:1;max-width:230px;background:var(--brick);opacity:.85;}
  .rule .dot{width:11px;height:11px;border-radius:50%;background:var(--brick);}

  /* price */
  .price{font-family:var(--sd);font-weight:900;color:var(--brick);font-size:184px;line-height:.9;margin-top:44px;letter-spacing:-.01em;}

  /* ingredients */
  .ingredients{font-family:var(--sd);font-weight:700;text-transform:uppercase;
               font-size:56px;line-height:1.2;letter-spacing:.05em;color:var(--olive);margin-top:40px;}

  /* add-on panel */
  .panel{margin-top:66px;width:100%;border:2px solid var(--olive);background:rgba(63,70,50,.04);
         padding:46px 48px 52px;}
  .panel-head{font-family:var(--sd);font-weight:600;text-transform:uppercase;letter-spacing:.14em;
              font-size:32px;line-height:1.3;color:var(--ink);}
  .panel-head .amt{color:var(--brick);font-weight:700;}
  .choices{margin-top:32px;}
  .choice{font-family:var(--sd);font-weight:600;text-transform:uppercase;letter-spacing:.1em;
          font-size:45px;color:var(--ink);padding:26px 0;border-top:2px dotted rgba(63,70,50,.45);}
  .choice:first-child{border-top:0;}

  /* footer brand lockup */
  .foot{margin-top:auto;padding-top:40px;}
  .foot .mark{font-family:var(--sd);font-weight:700;text-transform:uppercase;letter-spacing:.12em;
              font-size:27px;color:var(--brick);}
  .foot .sub{font-family:var(--st);text-transform:uppercase;letter-spacing:.32em;font-size:17px;color:var(--olive);margin-top:8px;}
</style>
</head>
<body>
<div class="sign" id="sign">

  <div class="eyebrow-script">our Schiacciata Croccante</div>
  <svg class="wheat flourish" width="150" height="26" viewBox="0 0 150 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
    <line x1="14" y1="13" x2="60" y2="13"/><line x1="90" y1="13" x2="136" y2="13"/>
    <path d="M75 4 V22"/>
    <path d="M75 8 C69 9 65 11 63 14"/><path d="M75 8 C81 9 85 11 87 14"/>
    <path d="M75 14 C69 15 65 17 63 20"/><path d="M75 14 C81 15 85 17 87 20"/>
    <path d="M75 4 C72 1.5 72 .5 75 -1 C78 .5 78 1.5 75 4 Z" fill="currentColor" stroke="none"/>
  </svg>

  <div class="headline">This <span class="hl">Weekend</span> Special</div>
  <div class="rule"><span class="ln"></span><span class="dot"></span><span class="ln"></span></div>

  <div class="price">$14</div>

  <div class="ingredients">Tomato, Burrata,<br>Basil &amp; EVOO</div>

  <div class="panel">
    <div class="panel-head">For <span class="amt">$5</span>, add one of the following</div>
    <div class="choices">
      <div class="choice">Prosciutto</div>
      <div class="choice">Mortadella</div>
      <div class="choice">Salami Rosa</div>
      <div class="choice">Oven-Roasted Turkey</div>
    </div>
  </div>

  <div class="foot">
    <svg class="wheat" width="130" height="24" viewBox="0 0 130 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="color:var(--gold);margin-bottom:22px" aria-hidden="true">
      <line x1="10" y1="12" x2="52" y2="12"/><line x1="78" y1="12" x2="120" y2="12"/>
      <path d="M65 4 V20"/>
      <path d="M65 8 C60 9 56 11 54 14"/><path d="M65 8 C70 9 74 11 76 14"/>
      <path d="M65 13 C60 14 56 16 54 19"/><path d="M65 13 C70 14 74 16 76 19"/>
      <path d="M65 4 C62 1.5 62 .5 65 -1 C68 .5 68 1.5 65 4 Z" fill="currentColor" stroke="none"/>
    </svg>
    <div class="mark">The Red Hook Focacceria</div>
    <div class="sub">Red Hook &#183; Brooklyn</div>
  </div>

</div>
</body>
</html>
